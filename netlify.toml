[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# Statický build (TanStack Start, předrenderované HTML pro každou stránku).
# Neexistující adresy zobrazí public/404.html.

# Dlouhá cache pro hashované soubory
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Staré adresy z původního sittravel.cz → nové stránky
# (zdroj pravdy: src/lib/redirects.ts — při změně upravit i zde)
[[redirects]]
  from = "/o-nas"
  to = "/#o-nas"
  status = 301

